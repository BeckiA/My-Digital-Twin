[project]
name = "digital-twin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "beckia", email = "berekeetabera@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "gradio>=6.29.1",
    "openai>=3.26.1",
    "openai-agents>=0.23.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "truststore>=0.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
digital-twin = "digital_twin:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
system-certs = true

